name: Deploy Saad five-year plan to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "saad-five-year-plan/**"
      - ".github/workflows/deploy-five-year-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/saad-five-year-plan
          cp -R saad-five-year-plan/. _site/saad-five-year-plan/
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./saad-five-year-plan/">
            <title>Morpheus Five-Year Command Plan</title>
          </head>
          <body>
            <p><a href="./saad-five-year-plan/">Open the Morpheus Five-Year Command Plan</a></p>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

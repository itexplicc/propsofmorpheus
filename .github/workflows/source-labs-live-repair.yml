name: Source Labs Category Experience Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-labs-live-repair.yml'
      - 'source-labs-current/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: source-labs-category-experience
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare and validate Source Labs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source-labs
          cp -R source-labs-current source-labs

          python3 - <<'PY'
          from pathlib import Path

          public_css = '<link rel="stylesheet" href="assets/v3.css">'
          public_js = '<script src="assets/category-discovery.js" defer></script>'
          for path in Path('source-labs').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if public_css not in text:
                  text = text.replace('</head>', f'  {public_css}\n</head>')
              if public_js not in text:
                  text = text.replace('</head>', f'  {public_js}\n</head>')
              path.write_text(text, encoding='utf-8')

          app_path = Path('source-labs/assets/app.js')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace("else if (PAGE === 'products') renderCatalogue('product');", "else if (PAGE === 'products' && !document.querySelector('script[src*=\"category-discovery\"]')) renderCatalogue('product');")
          app = app.replace("else if (PAGE === 'services') renderCatalogue('service');", "else if (PAGE === 'services' && !document.querySelector('script[src*=\"category-discovery\"]')) renderCatalogue('service');")
          app_path.write_text(app, encoding='utf-8')

          admin_path = Path('source-labs/admin/index.html')
          admin = admin_path.read_text(encoding='utf-8')
          admin_css = '<link rel="stylesheet" href="admin-v3.css">'
          admin_js = '<script src="admin-v3.js" defer></script>'
          if admin_css not in admin:
              admin = admin.replace('</head>', f'  {admin_css}\n</head>')
          if admin_js not in admin:
              admin = admin.replace('</head>', f'  {admin_js}\n</head>')
          admin_path.write_text(admin, encoding='utf-8')
          PY

          required=(
            source-labs/index.html
            source-labs/products.html
            source-labs/services.html
            source-labs/category.html
            source-labs/about.html
            source-labs/contact.html
            source-labs/privacy.html
            source-labs/terms.html
            source-labs/assets/styles.css
            source-labs/assets/app.js
            source-labs/assets/redesign.js
            source-labs/assets/v3.css
            source-labs/assets/category-discovery.js
            source-labs/assets/config.js
            source-labs/admin/index.html
            source-labs/admin/admin.css
            source-labs/admin/admin.js
            source-labs/admin/admin-v3.css
            source-labs/admin/admin-v3.js
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing required file: $file" >&2; exit 1; }
          done

          node --check source-labs/assets/app.js
          node --check source-labs/assets/redesign.js
          node --check source-labs/assets/category-discovery.js
          node --check source-labs/admin/admin.js
          node --check source-labs/admin/admin-v3.js
          grep -q 'Source Labs category discovery' source-labs/assets/v3.css
          grep -q 'category_landings' source-labs/assets/category-discovery.js
          grep -q 'Category landing pages' source-labs/admin/admin-v3.js
          grep -q 'assets/category-discovery.js' source-labs/products.html
          grep -q 'assets/category-discovery.js' source-labs/services.html
          grep -q 'admin-v3.js' source-labs/admin/index.html
          grep -q 'aunqmysckjuucmvzqxjp.supabase.co' source-labs/assets/config.js
          if grep -qi 'service_role' source-labs/assets/config.js; then
            echo 'A privileged Supabase key must never be shipped to the browser.' >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build complete Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/tin-tech-packaging _site/mako-pet-food _site/nautical-naturals-brand _site/nautical-naturals _site/hi-line-auto _site/qaj-young-hearts _site/apex-rubber _site/source-labs
          cp -R tin-tech-packaging/. _site/tin-tech-packaging/
          python3 mako-site-source/run-build.py _site/mako-pet-food
          cat > _site/nautical-naturals-brand/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=../mako-pet-food/"><link rel="canonical" href="../mako-pet-food/"><title>MAKO</title></head><body><p><a href="../mako-pet-food/">Open MAKO</a></p></body></html>
          HTML
          cp _site/nautical-naturals-brand/index.html _site/nautical-naturals/index.html
          cp -R hi-line-auto/. _site/hi-line-auto/
          cp -R qaj-young-hearts/. _site/qaj-young-hearts/
          cp -R apex-rubber/. _site/apex-rubber/
          cp -R source-labs/. _site/source-labs/
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Public Brand Sites</title><style>body{font-family:system-ui;margin:0;padding:48px;background:#f5f3ee;color:#12324a}main{max-width:760px;margin:auto}a{display:block;margin:14px 0;padding:18px 20px;border:1px solid #d8d2c8;border-radius:16px;background:#fff;color:#12324a;text-decoration:none;font-weight:700}</style></head><body><main><h1>Public Brand Sites</h1><a href="./source-labs/">Source Labs</a><a href="./qaj-young-hearts/">Quranic Arabic for Young Hearts</a><a href="./hi-line-auto/">Hi-Line Auto</a><a href="./mako-pet-food/">MAKO Premium Dog &amp; Cat Food</a><a href="./tin-tech-packaging/">Tin Tech Packaging</a></main></body></html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public, category and admin experiences
        shell: bash
        run: |
          set -euo pipefail
          base='https://itexplicc.github.io/propsofmorpheus/source-labs'
          for attempt in $(seq 1 36); do
            public_code="$(curl -L --silent --show-error -o /tmp/products.html -w '%{http_code}' "${base}/products.html?release=${GITHUB_SHA}" || true)"
            category_code="$(curl -L --silent --show-error -o /tmp/category.html -w '%{http_code}' "${base}/category.html?slug=packaging-materials&release=${GITHUB_SHA}" || true)"
            admin_code="$(curl -L --silent --show-error -o /tmp/admin.html -w '%{http_code}' "${base}/admin/?release=${GITHUB_SHA}" || true)"
            public_js_code="$(curl -L --silent --show-error -o /tmp/category-discovery.js -w '%{http_code}' "${base}/assets/category-discovery.js?release=${GITHUB_SHA}" || true)"
            admin_js_code="$(curl -L --silent --show-error -o /tmp/admin-v3.js -w '%{http_code}' "${base}/admin/admin-v3.js?release=${GITHUB_SHA}" || true)"
            css_code="$(curl -L --silent --show-error -o /tmp/v3.css -w '%{http_code}' "${base}/assets/v3.css?release=${GITHUB_SHA}" || true)"
            if [ "$public_code" = 200 ] && [ "$category_code" = 200 ] && [ "$admin_code" = 200 ] && [ "$public_js_code" = 200 ] && [ "$admin_js_code" = 200 ] && [ "$css_code" = 200 ] \
              && grep -q 'assets/category-discovery.js' /tmp/products.html \
              && grep -q 'data-page="category"' /tmp/category.html \
              && grep -q 'admin-v3.js' /tmp/admin.html \
              && grep -q 'category_landings' /tmp/category-discovery.js \
              && grep -q 'Category landing pages' /tmp/admin-v3.js \
              && grep -q 'v3-menu-backdrop' /tmp/v3.css; then
              echo 'Verified Source Labs category experience deployment.'
              break
            fi
            if [ "$attempt" = 36 ]; then echo 'Could not verify Source Labs category experience deployment.' >&2; exit 1; fi
            sleep 10
          done

          mkdir -p .deploy-status
          cat > .deploy-status/source-labs-live.txt <<EOF2
          Source Labs category experience deployment verified successfully.
          Source commit: ${GITHUB_SHA}
          Public URL: ${base}/
          Products URL: ${base}/products.html
          Services URL: ${base}/services.html
          Category URL pattern: ${base}/category.html?slug=<category-slug>
          Admin URL: ${base}/admin/
          Experience: category-first-media-v3
          Completed: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/source-labs-live.txt
          git commit -m 'Record verified Source Labs category deployment'
          git push origin HEAD:main

name: Deploy Public Brand Sites to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'tin-tech-packaging/**'
      - 'mako-site-source/**'
      - 'hi-line-auto/**'
      - 'qaj-young-hearts/**'
      - 'apex-rubber/**'
      - 'source-labs/**'
      - 'source-labs-build/direct-release.b64'
      - '.github/workflows/deploy-tin-tech-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public sites
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/tin-tech-packaging
          mkdir -p _site/mako-pet-food
          mkdir -p _site/nautical-naturals-brand
          mkdir -p _site/nautical-naturals
          mkdir -p _site/hi-line-auto
          mkdir -p _site/qaj-young-hearts
          mkdir -p _site/apex-rubber
          mkdir -p _site/source-labs

          cp tin-tech-packaging/index.html _site/tin-tech-packaging/index.html
          cp tin-tech-packaging/about.html _site/tin-tech-packaging/about.html
          cp tin-tech-packaging/capabilities.html _site/tin-tech-packaging/capabilities.html
          cp tin-tech-packaging/portfolio.html _site/tin-tech-packaging/portfolio.html
          cp tin-tech-packaging/product.html _site/tin-tech-packaging/product.html
          cp tin-tech-packaging/contact.html _site/tin-tech-packaging/contact.html
          cp tin-tech-packaging/privacy.html _site/tin-tech-packaging/privacy.html
          cp tin-tech-packaging/terms.html _site/tin-tech-packaging/terms.html
          cp tin-tech-packaging/404.html _site/tin-tech-packaging/404.html
          cp tin-tech-packaging/robots.txt _site/tin-tech-packaging/robots.txt
          cp tin-tech-packaging/sitemap.xml _site/tin-tech-packaging/sitemap.xml
          cp tin-tech-packaging/tin-tech-logo.svg _site/tin-tech-packaging/tin-tech-logo.svg
          cp tin-tech-packaging/tin-tech-logo-light.svg _site/tin-tech-packaging/tin-tech-logo-light.svg
          cp -R tin-tech-packaging/assets _site/tin-tech-packaging/assets
          cp -R tin-tech-packaging/admin _site/tin-tech-packaging/admin

          python3 mako-site-source/run-build.py _site/mako-pet-food
          test -f _site/mako-pet-food/index.html
          test -f _site/mako-pet-food/products.html
          test -f _site/mako-pet-food/review.html
          test -s _site/mako-pet-food/assets/images/mako-pack.jpg
          grep -q 'MAKO' _site/mako-pet-food/index.html
          grep -q 'mako_brand_feedback' _site/mako-pet-food/assets/js/site.js
          if grep -Rqi 'Nautical Naturals' _site/mako-pet-food; then
            echo 'Old brand reference detected in MAKO build.' >&2
            exit 1
          fi

          cat > _site/nautical-naturals-brand/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=../mako-pet-food/"><link rel="canonical" href="../mako-pet-food/"><title>MAKO</title></head><body><p><a href="../mako-pet-food/">Open MAKO</a></p></body></html>
          HTML
          cp _site/nautical-naturals-brand/index.html _site/nautical-naturals/index.html

          cp -R hi-line-auto/. _site/hi-line-auto/
          test -f _site/hi-line-auto/index.html
          test -f _site/hi-line-auto/admin.html
          test -f _site/hi-line-auto/config.js
          grep -q 'gxxfxsvviigzwtkgiduv' _site/hi-line-auto/config.js

          cp -R qaj-young-hearts/. _site/qaj-young-hearts/
          test -f _site/qaj-young-hearts/index.html
          test -f _site/qaj-young-hearts/admin.html
          test -f _site/qaj-young-hearts/assets/config.js
          test -f _site/qaj-young-hearts/assets/app-loader.js
          test -f _site/qaj-young-hearts/assets/admin-loader.js
          test -f _site/qaj-young-hearts/assets/style-loader.js
          grep -q 'Quranic Arabic for Young Hearts' _site/qaj-young-hearts/index.html
          grep -q 'zadxvmpgngwtpsmdkcod.supabase.co' _site/qaj-young-hearts/assets/config.js

          cp -R apex-rubber/. _site/apex-rubber/
          test -f _site/apex-rubber/remaining-75k/index.html

          base64 --decode source-labs-build/direct-release.b64 > /tmp/source-labs-direct.tar.gz
          echo '75a28a15533105a70c5f3db3d09f0fcd697beb0f62930cbda4e57c3fe73be218  /tmp/source-labs-direct.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/source-labs-direct.tar.gz -C _site/source-labs --strip-components=1 --no-same-owner

          test -f _site/source-labs/index.html
          test -f _site/source-labs/products.html
          test -f _site/source-labs/services.html
          test -f _site/source-labs/contact.html
          test -f _site/source-labs/admin/index.html
          test -s _site/source-labs/assets/app.js
          test -s _site/source-labs/assets/styles.css
          test -s _site/source-labs/assets/redesign.js
          test -s _site/source-labs/admin/admin.js
          grep -q 'Source Labs' _site/source-labs/index.html
          grep -q 'aunqmysckjuucmvzqxjp.supabase.co' _site/source-labs/assets/config.js
          grep -q 'Source Labs visual system' _site/source-labs/assets/styles.css
          grep -q 'SOURCE BRIEF' _site/source-labs/assets/redesign.js
          grep -q 'assets/redesign.js' _site/source-labs/index.html
          node --check _site/source-labs/assets/app.js
          node --check _site/source-labs/assets/redesign.js
          node --check _site/source-labs/admin/admin.js
          node --check _site/source-labs/assets/config.js

          touch _site/.nojekyll

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Public Brand Sites</title>
            <style>
              body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;padding:48px;background:#f5f3ee;color:#12324a}
              main{max-width:760px;margin:auto}
              a{display:block;margin:14px 0;padding:18px 20px;border:1px solid #d8d2c8;border-radius:16px;background:#fff;color:#12324a;text-decoration:none;font-weight:700}
            </style>
          </head>
          <body>
            <main>
              <h1>Public Brand Sites</h1>
              <a href="./source-labs/">Source Labs</a>
              <a href="./qaj-young-hearts/">Quranic Arabic for Young Hearts</a>
              <a href="./hi-line-auto/">Hi-Line Auto</a>
              <a href="./mako-pet-food/">MAKO Premium Dog &amp; Cat Food</a>
              <a href="./tin-tech-packaging/">Tin Tech Packaging</a>
            </main>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Source Labs public pages
        shell: bash
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}source-labs/
          ADMIN_URL: ${{ steps.deployment.outputs.page_url }}source-labs/admin/
          CSS_URL: ${{ steps.deployment.outputs.page_url }}source-labs/assets/styles.css
          REDESIGN_URL: ${{ steps.deployment.outputs.page_url }}source-labs/assets/redesign.js
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --location "$PUBLIC_URL" -o /tmp/source-labs-public.html \
              && curl --fail --silent --show-error --location "$ADMIN_URL" -o /tmp/source-labs-admin.html \
              && curl --fail --silent --show-error --location "$CSS_URL" -o /tmp/source-labs-styles.css \
              && curl --fail --silent --show-error --location "$REDESIGN_URL" -o /tmp/source-labs-redesign.js \
              && grep -q 'assets/redesign.js' /tmp/source-labs-public.html \
              && grep -q 'Source Labs visual system' /tmp/source-labs-styles.css \
              && grep -q 'SOURCE BRIEF' /tmp/source-labs-redesign.js \
              && grep -q 'Source Labs' /tmp/source-labs-admin.html; then
              exit 0
            fi
            sleep 4
          done
          echo 'Source Labs refined public verification failed.' >&2
          exit 1

      - name: Record successful Pages deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.deploy-status/public-pages.txt';
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main'
              });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const body = [
              'Public brand sites deployment completed successfully.',
              'Source Labs refined interface verification passed.',
              `Source commit: ${context.sha}`,
              `Pages URL: ${{ steps.deployment.outputs.page_url }}`,
              `Source Labs URL: ${{ steps.deployment.outputs.page_url }}source-labs/`,
              `Source Labs Admin URL: ${{ steps.deployment.outputs.page_url }}source-labs/admin/`,
              `Completed: ${new Date().toISOString()}`,
              ''
            ].join('\n');
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Record successful refined Source Labs deployment',
              content: Buffer.from(body).toString('base64'),
              branch: 'main',
              ...(sha ? { sha } : {})
            });

name: Deploy Consolidated Public Sites to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'tin-tech-packaging/**'
      - 'mako-site-source/**'
      - 'hi-line-auto/**'
      - 'qaj-young-hearts/**'
      - 'apex-rubber/**'
      - 'source-labs/**'
      - 'source-labs-build/**'
      - 'saad-five-year-plan/**'
      - 'galle-spice/**'
      - '.github/workflows/deploy-tin-tech-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public sites
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p \
            _site/tin-tech-packaging \
            _site/mako-pet-food \
            _site/nautical-naturals-brand \
            _site/nautical-naturals \
            _site/hi-line-auto \
            _site/qaj-young-hearts \
            _site/apex-rubber \
            _site/source-labs \
            _site/saad-five-year-plan \
            _site/galle-spice

          # Tin Tech: publish the complete current folder so direct files such as
          # /tin-tech-packaging/index.html always exist in the Pages artifact.
          cp -R tin-tech-packaging/. _site/tin-tech-packaging/
          test -f _site/tin-tech-packaging/index.html
          test -f _site/tin-tech-packaging/portfolio.html
          test -f _site/tin-tech-packaging/product.html
          test -f _site/tin-tech-packaging/admin/index.html
          test -f _site/tin-tech-packaging/assets/js/site.js
          grep -q 'TIN TECH PACKAGING' _site/tin-tech-packaging/index.html

          python3 mako-site-source/run-build.py _site/mako-pet-food
          test -f _site/mako-pet-food/index.html
          test -f _site/mako-pet-food/products.html
          test -f _site/mako-pet-food/review.html
          test -s _site/mako-pet-food/assets/images/mako-pack.jpg
          grep -q 'MAKO' _site/mako-pet-food/index.html
          grep -q 'mako_brand_feedback' _site/mako-pet-food/assets/js/site.js
          if grep -Rqi 'Nautical Naturals' _site/mako-pet-food; then
            echo 'Old brand reference detected in MAKO build.' >&2
            exit 1
          fi

          cat > _site/nautical-naturals-brand/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=../mako-pet-food/"><link rel="canonical" href="../mako-pet-food/"><title>MAKO</title></head><body><p><a href="../mako-pet-food/">Open MAKO</a></p></body></html>
          HTML
          cp _site/nautical-naturals-brand/index.html _site/nautical-naturals/index.html

          cp -R hi-line-auto/. _site/hi-line-auto/
          test -f _site/hi-line-auto/index.html
          test -f _site/hi-line-auto/admin.html
          test -f _site/hi-line-auto/config.js
          grep -q 'gxxfxsvviigzwtkgiduv' _site/hi-line-auto/config.js

          cp -R qaj-young-hearts/. _site/qaj-young-hearts/
          test -f _site/qaj-young-hearts/index.html
          test -f _site/qaj-young-hearts/admin.html
          test -f _site/qaj-young-hearts/assets/config.js
          test -f _site/qaj-young-hearts/assets/app-loader.js
          test -f _site/qaj-young-hearts/assets/admin-loader.js
          test -f _site/qaj-young-hearts/assets/style-loader.js
          grep -q 'Quranic Arabic for Young Hearts' _site/qaj-young-hearts/index.html
          grep -q 'zadxvmpgngwtpsmdkcod.supabase.co' _site/qaj-young-hearts/assets/config.js

          cp -R apex-rubber/. _site/apex-rubber/
          test -f _site/apex-rubber/remaining-75k/index.html

          # Reassemble and verify the complete six-part Source Labs xz release.
          for part in source-labs-build/release-20260730.tar.xz.b64.{00..05}; do
            test -s "$part"
          done
          cat source-labs-build/release-20260730.tar.xz.b64.{00..05} > /tmp/source-labs-release.b64
          base64 --decode /tmp/source-labs-release.b64 > /tmp/source-labs-release.tar.xz
          xz --test /tmp/source-labs-release.tar.xz
          tar -tJf /tmp/source-labs-release.tar.xz >/dev/null
          tar -xJf /tmp/source-labs-release.tar.xz -C _site/source-labs --strip-components=1 --no-same-owner

          test -f _site/source-labs/index.html
          test -f _site/source-labs/products.html
          test -f _site/source-labs/services.html
          test -f _site/source-labs/contact.html
          test -f _site/source-labs/admin/index.html
          test -s _site/source-labs/assets/app.js
          test -s _site/source-labs/assets/styles.css
          test -s _site/source-labs/admin/admin.js
          grep -q 'Source Labs' _site/source-labs/index.html
          grep -q 'aunqmysckjuucmvzqxjp.supabase.co' _site/source-labs/assets/config.js
          node --check _site/source-labs/assets/app.js
          node --check _site/source-labs/admin/admin.js
          node --check _site/source-labs/assets/config.js

          cp -R saad-five-year-plan/. _site/saad-five-year-plan/
          test -f _site/saad-five-year-plan/index.html

          cp -R galle-spice/. _site/galle-spice/
          test -f _site/galle-spice/index.html
          test -f _site/galle-spice/admin/index.html
          grep -q 'Galle Spice' _site/galle-spice/index.html

          touch _site/.nojekyll

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Public Sites</title>
            <style>
              body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;padding:48px;background:#f5f3ee;color:#12324a}
              main{max-width:760px;margin:auto}
              a{display:block;margin:14px 0;padding:18px 20px;border:1px solid #d8d2c8;border-radius:16px;background:#fff;color:#12324a;text-decoration:none;font-weight:700}
            </style>
          </head>
          <body>
            <main>
              <h1>Public Sites</h1>
              <a href="./tin-tech-packaging/">Tin Tech Packaging</a>
              <a href="./galle-spice/">Galle Spice</a>
              <a href="./source-labs/">Source Labs</a>
              <a href="./qaj-young-hearts/">Quranic Arabic for Young Hearts</a>
              <a href="./hi-line-auto/">Hi-Line Auto</a>
              <a href="./mako-pet-food/">MAKO Premium Dog &amp; Cat Food</a>
              <a href="./saad-five-year-plan/">Morpheus Five-Year Command Plan</a>
              <a href="./apex-rubber/remaining-75k/">APEX Remaining 75K Plan</a>
            </main>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify consolidated public pages
        shell: bash
        env:
          ROOT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location "${ROOT_URL}tin-tech-packaging/index.html" -o /tmp/tin-tech-index.html \
              && curl --fail --silent --show-error --location "${ROOT_URL}tin-tech-packaging/portfolio.html" -o /tmp/tin-tech-portfolio.html \
              && curl --fail --silent --show-error --location "${ROOT_URL}galle-spice/index.html" -o /tmp/galle-spice-index.html \
              && curl --fail --silent --show-error --location "${ROOT_URL}saad-five-year-plan/index.html" -o /tmp/five-year-index.html \
              && curl --fail --silent --show-error --location "${ROOT_URL}source-labs/index.html" -o /tmp/source-labs-public.html \
              && curl --fail --silent --show-error --location "${ROOT_URL}source-labs/services.html" -o /tmp/source-labs-services.html \
              && curl --fail --silent --show-error --location "${ROOT_URL}source-labs/admin/index.html" -o /tmp/source-labs-admin.html \
              && curl --fail --silent --show-error --location "${ROOT_URL}source-labs/assets/config.js" -o /tmp/source-labs-config.js \
              && grep -q 'TIN TECH PACKAGING' /tmp/tin-tech-index.html \
              && grep -q 'Product portfolio' /tmp/tin-tech-portfolio.html \
              && grep -q 'Galle Spice' /tmp/galle-spice-index.html \
              && grep -q 'Morpheus' /tmp/five-year-index.html \
              && grep -q 'Source Labs' /tmp/source-labs-public.html \
              && grep -q 'Source Labs' /tmp/source-labs-services.html \
              && grep -q 'Source Labs' /tmp/source-labs-admin.html \
              && grep -q 'aunqmysckjuucmvzqxjp.supabase.co' /tmp/source-labs-config.js; then
              echo 'Consolidated Pages verification passed.'
              exit 0
            fi
            sleep 4
          done
          echo 'Consolidated public Pages verification failed.' >&2
          exit 1

      - name: Record successful Pages deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.deploy-status/public-pages.txt';
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main'
              });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const body = [
              'Consolidated public sites deployment completed successfully.',
              'Tin Tech direct index verification passed.',
              'Galle Spice, five-year plan and Source Labs verification passed.',
              `Source commit: ${context.sha}`,
              `Pages URL: ${{ steps.deployment.outputs.page_url }}`,
              `Tin Tech URL: ${{ steps.deployment.outputs.page_url }}tin-tech-packaging/index.html`,
              `Completed: ${new Date().toISOString()}`,
              ''
            ].join('\n');
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Record successful consolidated Pages deployment',
              content: Buffer.from(body).toString('base64'),
              branch: 'main',
              ...(sha ? { sha } : {})
            });

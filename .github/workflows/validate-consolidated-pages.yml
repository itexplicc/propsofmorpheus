name: Validate Consolidated Pages Workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-tin-tech-pages.yml'
      - '.github/workflows/deploy-five-year-plan.yml'
      - '.github/workflows/validate-consolidated-pages.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate consolidated deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f tin-tech-packaging/index.html
          test -f tin-tech-packaging/admin/index.html
          test -f saad-five-year-plan/index.html
          test -f galle-spice/index.html
          test -f galle-spice/admin/index.html
          test ! -f .github/workflows/deploy-five-year-plan.yml
          grep -q "cp -R tin-tech-packaging/. _site/tin-tech-packaging/" .github/workflows/deploy-tin-tech-pages.yml
          grep -q "tin-tech-packaging/index.html" .github/workflows/deploy-tin-tech-pages.yml
          grep -q "saad-five-year-plan" .github/workflows/deploy-tin-tech-pages.yml
          grep -q "galle-spice" .github/workflows/deploy-tin-tech-pages.yml
          grep -q "Verify consolidated public pages" .github/workflows/deploy-tin-tech-pages.yml

          rm -rf /tmp/source-labs-check
          mkdir -p /tmp/source-labs-check
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/itexplicc/propsofmorpheus/bffff490f83589956bd51352c7b7032e137cdd33/source-labs-build/direct-release.b64' \
            -o /tmp/source-labs-direct.b64
          base64 --decode /tmp/source-labs-direct.b64 > /tmp/source-labs-direct.tar.gz
          echo '75a28a15533105a70c5f3db3d09f0fcd697beb0f62930cbda4e57c3fe73be218  /tmp/source-labs-direct.tar.gz' | sha256sum --check --strict
          gzip --test /tmp/source-labs-direct.tar.gz
          tar -tzf /tmp/source-labs-direct.tar.gz >/dev/null
          tar -xzf /tmp/source-labs-direct.tar.gz -C /tmp/source-labs-check --strip-components=1 --no-same-owner
          test -f /tmp/source-labs-check/index.html
          test -f /tmp/source-labs-check/admin/index.html
          test -s /tmp/source-labs-check/assets/styles.css
          test -s /tmp/source-labs-check/assets/redesign.js
          grep -q 'Source Labs' /tmp/source-labs-check/index.html
          grep -q 'Source Labs visual system' /tmp/source-labs-check/assets/styles.css
          grep -q 'SOURCE BRIEF' /tmp/source-labs-check/assets/redesign.js

          echo 'Consolidated Pages workflow and verified Source Labs release validation passed.'

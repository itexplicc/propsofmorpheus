name: Validate Consolidated Pages Workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-tin-tech-pages.yml'
      - '.github/workflows/deploy-five-year-plan.yml'
      - '.github/workflows/validate-consolidated-pages.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate consolidated deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f tin-tech-packaging/index.html
          test -f tin-tech-packaging/admin/index.html
          test -f saad-five-year-plan/index.html
          test -f galle-spice/index.html
          test -f galle-spice/admin/index.html
          test ! -f .github/workflows/deploy-five-year-plan.yml
          grep -q "cp -R tin-tech-packaging/. _site/tin-tech-packaging/" .github/workflows/deploy-tin-tech-pages.yml
          grep -q "tin-tech-packaging/index.html" .github/workflows/deploy-tin-tech-pages.yml
          grep -q "saad-five-year-plan" .github/workflows/deploy-tin-tech-pages.yml
          grep -q "galle-spice" .github/workflows/deploy-tin-tech-pages.yml
          grep -q "Verify consolidated public pages" .github/workflows/deploy-tin-tech-pages.yml

          for part in source-labs-build/site.tar.gz.b64.part-{00..07}; do
            test -s "$part"
          done
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          parts = [Path(f'source-labs-build/site.tar.gz.b64.part-{index:02d}') for index in range(8)]
          payload = b''.join(path.read_bytes() for path in parts)
          payload = re.sub(rb'\s+', b'', payload)
          if len(payload) % 4:
              payload += b'=' * (-len(payload) % 4)
          decoded = base64.b64decode(payload, validate=True)
          Path('/tmp/source-labs-site.tar.gz').write_bytes(decoded)
          PY
          gzip --test /tmp/source-labs-site.tar.gz
          tar -tzf /tmp/source-labs-site.tar.gz >/dev/null

          rm -rf /tmp/source-labs-check
          mkdir -p /tmp/source-labs-check
          tar -xzf /tmp/source-labs-site.tar.gz -C /tmp/source-labs-check --strip-components=1 --no-same-owner
          test -f /tmp/source-labs-check/index.html
          test -f /tmp/source-labs-check/products.html
          test -f /tmp/source-labs-check/services.html
          test -f /tmp/source-labs-check/contact.html
          test -f /tmp/source-labs-check/admin/index.html
          test -s /tmp/source-labs-check/assets/app.js
          test -s /tmp/source-labs-check/assets/styles.css
          test -s /tmp/source-labs-check/assets/redesign.js
          test -s /tmp/source-labs-check/admin/admin.js
          grep -q 'Source Labs' /tmp/source-labs-check/index.html
          grep -q 'aunqmysckjuucmvzqxjp.supabase.co' /tmp/source-labs-check/assets/config.js
          grep -q 'Source Labs visual system' /tmp/source-labs-check/assets/styles.css
          grep -q 'SOURCE BRIEF' /tmp/source-labs-check/assets/redesign.js
          grep -q 'assets/redesign.js' /tmp/source-labs-check/index.html
          node --check /tmp/source-labs-check/assets/app.js
          node --check /tmp/source-labs-check/assets/redesign.js
          node --check /tmp/source-labs-check/admin/admin.js
          node --check /tmp/source-labs-check/assets/config.js

          echo 'Consolidated Pages workflow and complete Source Labs site release validation passed.'

name: Validate Consolidated Pages Workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-tin-tech-pages.yml'
      - '.github/workflows/deploy-five-year-plan.yml'
      - '.github/workflows/validate-consolidated-pages.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect split Source Labs release
        shell: bash
        run: |
          set -euo pipefail
          find source-labs-build -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          paths = sorted(Path('source-labs-build').glob('direct-release*'))
          print('parts:', [p.name for p in paths])
          for path in paths:
              raw = path.read_bytes()
              print(path.name, 'size=', len(raw), 'head=', raw[:16], 'tail=', raw[-16:])
          combined = b''.join(path.read_bytes() for path in paths)
          clean = re.sub(rb'\s+', b'', combined)
          print('combined=', len(combined), 'clean=', len(clean), 'mod4=', len(clean) % 4)
          print('combined head=', clean[:24], 'tail=', clean[-24:])
          try:
              decoded = base64.b64decode(clean, validate=True)
          except Exception as exc:
              print('strict decode failed:', repr(exc))
              raise
          Path('/tmp/source-labs-direct.tar.gz').write_bytes(decoded)
          print('decoded bytes=', len(decoded))
          PY

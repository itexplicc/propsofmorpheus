name: Validate Consolidated Pages Workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-tin-tech-pages.yml'
      - '.github/workflows/deploy-five-year-plan.yml'
      - '.github/workflows/validate-consolidated-pages.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect valid Source Labs xz release
        shell: bash
        run: |
          set -euo pipefail
          for part in source-labs-build/release-20260730.tar.xz.b64.{00..05}; do
            test -s "$part"
          done
          cat source-labs-build/release-20260730.tar.xz.b64.{00..05} > /tmp/source-labs-release.b64
          base64 --decode /tmp/source-labs-release.b64 > /tmp/source-labs-release.tar.xz
          xz --test /tmp/source-labs-release.tar.xz
          tar -tJf /tmp/source-labs-release.tar.xz >/dev/null
          rm -rf /tmp/source-labs-check
          mkdir -p /tmp/source-labs-check
          tar -xJf /tmp/source-labs-release.tar.xz -C /tmp/source-labs-check --strip-components=1 --no-same-owner
          echo '--- Source Labs release files ---'
          find /tmp/source-labs-check -maxdepth 3 -type f -printf '%P\n' | sort
          echo '--- HTML titles / scripts ---'
          grep -Rho '<title>[^<]*' /tmp/source-labs-check/*.html /tmp/source-labs-check/admin/*.html 2>/dev/null || true
          grep -Rho 'assets/[A-Za-z0-9._/-]*\.js' /tmp/source-labs-check/*.html 2>/dev/null | sort -u || true
          echo '--- Required identity check ---'
          grep -Rqi 'Source Labs' /tmp/source-labs-check
          echo 'Valid Source Labs xz release extracted successfully.'

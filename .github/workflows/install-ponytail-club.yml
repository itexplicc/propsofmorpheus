name: Keep Ponytail Club on Public Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-ponytail-club.yml'
      - 'ponytail-club-build/**'
  workflow_run:
    workflows:
      - 'Deploy Consolidated Public Sites to GitHub Pages'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ponytail
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Reuse consolidated public-site builder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/deploy-tin-tech-pages.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == '- name: Prepare public sites')
          run_index = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
          end = next((i for i in range(run_index + 1, len(lines)) if lines[i].startswith('      - name:')), len(lines))
          body = []
          for line in lines[run_index + 1:end]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  raise SystemExit(f'Unexpected indentation while extracting prepare script: {line!r}')
          Path('/tmp/prepare-public-sites.sh').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          bash /tmp/prepare-public-sites.sh

      - name: Add finished Ponytail Club multi-page site
        shell: bash
        run: |
          set -euo pipefail
          for part in ponytail-club-build/release-20260901.tar.xz.b64.{00..04}; do
            test -s "$part"
          done
          cat ponytail-club-build/release-20260901.tar.xz.b64.{00..04} > /tmp/ponytail-club-release.b64
          base64 --decode /tmp/ponytail-club-release.b64 > /tmp/ponytail-club-release.tar.xz
          xz --test /tmp/ponytail-club-release.tar.xz
          rm -rf _site/ponytail-club
          tar -xJf /tmp/ponytail-club-release.tar.xz -C _site --no-same-owner

          for page in index shop new-arrivals youth adult hoodies tshirts socks accessories product lookbook about contact faq shipping search wishlist cart; do
            test -f "_site/ponytail-club/${page}.html"
          done
          test -s _site/ponytail-club/assets/style.css
          test -s _site/ponytail-club/assets/app.js
          test -s _site/ponytail-club/assets/catalog.js
          test -s _site/ponytail-club/assets/pages.js
          node --check _site/ponytail-club/assets/app.js
          node --check _site/ponytail-club/assets/catalog.js
          node --check _site/ponytail-club/assets/pages.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Ponytail Club pages
        env:
          ROOT_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location "${ROOT_URL}ponytail-club/index.html" -o /tmp/pt-home.html \
              && curl --fail --silent --show-error --location "${ROOT_URL}ponytail-club/shop.html" -o /tmp/pt-shop.html \
              && curl --fail --silent --show-error --location "${ROOT_URL}ponytail-club/hoodies.html" -o /tmp/pt-hoodies.html \
              && curl --fail --silent --show-error --location "${ROOT_URL}ponytail-club/product.html?id=we-chirp-youth" -o /tmp/pt-product.html \
              && grep -q 'assets/app.js' /tmp/pt-home.html \
              && grep -q 'assets/app.js' /tmp/pt-shop.html \
              && grep -q 'assets/app.js' /tmp/pt-hoodies.html \
              && grep -q 'assets/app.js' /tmp/pt-product.html; then
              echo 'Ponytail Club multi-page site is live.'
              exit 0
            fi
            sleep 4
          done
          echo 'Ponytail Club live verification failed.' >&2
          exit 1
